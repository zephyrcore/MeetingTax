<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is protected focus time versus scattered meeting
  load. Core colour 1 slate (#3f4a5a) is meeting-shaped structure. Core colour 2
  green (#2f7d56) is a focus block that clears the threshold. Accent amber
  (#c8791a) marks the one bar that falls below the threshold, the finding the
  reader should look at first. Neutrals are ink #1c2230 and paper #ffffff.
  Numbers: longest uninterrupted focus block on 2026-09-07 per person, from
  the focus subcommand run against samples/team-calendar.ics with a 120 minute
  threshold. Ada 90 min, Bao 150 min, Chen 180 min. Threshold 120 min.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"
     aria-labelledby="title desc" width="520" height="300">
  <title id="title">Longest daily focus block per person against a 120 minute threshold</title>
  <desc id="desc">Horizontal bars for 2026-09-07: Ada 90 minutes below the
    threshold, Bao 150 minutes, Chen 180 minutes. A dashed vertical line marks
    the 120 minute focus threshold.</desc>

  <rect x="0" y="0" width="520" height="300" fill="#ffffff"/>

  <text x="24" y="34" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" fill="#1c2230">Longest focus block, 2026-09-07</text>
  <text x="24" y="54" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#3f4a5a">Minutes of uninterrupted time inside the 09:00 to 17:00 workday</text>

  <!-- Plot area: x from 120 to 440 maps 0 to 200 minutes, 1.6px per minute. -->
  <!-- Threshold at 120 min: 120 + 120*1.6 = 312 -->
  <line x1="312" y1="80" x2="312" y2="248" stroke="#1c2230" stroke-width="1"
        stroke-dasharray="4 3"/>
  <text x="312" y="268" text-anchor="middle"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="11" fill="#1c2230">threshold 120 min</text>

  <!-- Ada: 90 min, below threshold, accent amber. Bar length 90*1.6 = 144 -->
  <text x="112" y="103" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#1c2230">Ada</text>
  <rect x="120" y="90" width="144" height="24" rx="3" fill="#c8791a"/>
  <text x="272" y="107"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
