<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is protected focus time versus scattered meeting
  load. Core colour 1 slate (#3f4a5a) is meeting-shaped structure. Core colour 2
  green (#2f7d56) is a focus block that clears the threshold. Accent amber
  (#c8791a) marks the one bar that falls below the threshold, the finding the
  reader should look at first. Neutrals are ink #1c2230 and paper #ffffff.
  Numbers: longest uninterrupted focus block on 2026-09-07 per person, from
  the focus subcommand run against samples/team-calendar.ics with a 120 minute
  threshold. Ada 90 min, Bao 150 min, Chen 180 min. Threshold 120 min.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"
     aria-labelledby="title desc" width="520" height="300">
  <title id="title">Longest daily focus block per person against a 120 minute threshold</title>
  <desc id="desc">Horizontal bars for 2026-09-07: Ada 90 minutes below the
    threshold, Bao 150 minutes, Chen 180 minutes. A dashed vertical line marks
    the 120 minute focus threshold.</desc>

  <rect x="0" y="0" width="520" height="300" fill="#ffffff"/>

