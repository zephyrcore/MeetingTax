<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: same subject as the diagram. Slate #3f4a5a is meeting-occupied
  time, green #2f7d56 is the one free block, ink #1c2230 for the wordmark. The
  colour split falls at the morpheme boundary of the compound name: "meeting" in
  slate, "tax" in green, because the tax is what the meetings cost the free time.
  The mark above the word is a literal day strip: eight equal cells for a workday,
  six slate meeting cells and one green free block, the tool's core data shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img"
     aria-labelledby="title desc" width="240" height="120">
  <title id="title">meetingtax wordmark</title>
  <desc id="desc">The word meetingtax with meeting in slate and tax in green,
    above a day strip of eight cells where six are slate meeting blocks and two
    form one green free block.</desc>

  <rect x="0" y="0" width="240" height="120" fill="#ffffff"/>

  <!-- Day strip: 8 cells of 24 wide starting at x=24, y=24, height 20. -->
  <rect x="24"  y="24" width="24" height="20" rx="3" fill="#3f4a5a"/>
  <rect x="50"  y="24" width="24" height="20" rx="3" fill="#3f4a5a"/>
  <rect x="76"  y="24" width="24" height="20" rx="3" fill="#3f4a5a"/>
  <rect x="102" y="24" width="50" height="20" rx="3" fill="#2f7d56"/>
  <rect x="154" y="24" width="24" height="20" rx="3" fill="#3f4a5a"/>
  <rect x="180" y="24" width="24" height="20" rx="3" fill="#3f4a5a"/>
  <rect x="206" y="24" width="10" height="20" rx="3" fill="#3f4a5a"/>

